{% extends 'base.html' %}
{% block content %}
<h1>My account</h1>
<p>{{ g.user.email }}</p>
<form class="panel narrow" method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Name <input name="name" value="{{ g.user.name }}" maxlength="80" required></label>
  <button>Save name</button>
</form>
{% endblock %}
