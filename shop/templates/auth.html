{% extends 'base.html' %}{% block content %}<section class="panel narrow"><p class="eyebrow">YOUR CAMPUS CART</p><h1>{{ 'Create an account' if register else 'Welcome back' }}</h1><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">{% if register %}<label>Name<input name="name" maxlength="80" autocomplete="name" required></label>{% endif %}<label>Email<input type="email" name="email" maxlength="254" autocomplete="email" required></label><label>Password<input type="password" name="password" minlength="{{ 12 if register else 1 }}" maxlength="128" autocomplete="{{ 'new-password' if register else 'current-password' }}" required></label>{% if register %}<p>Use 12–128 characters.</p>{% endif %}<button>{{ 'Register' if register else 'Log in' }}</button></form></section>{% endblock %}
